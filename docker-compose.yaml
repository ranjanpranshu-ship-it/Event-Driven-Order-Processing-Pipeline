services:
  edge1:
    build: .
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=db-pipeline

  edge2:
    build: .
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - MONGODB_HOST=mongo
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=db-pipeline

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - edge1
      - edge2

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Kafka..."
        until bash -c 'echo > /dev/tcp/kafka/9092' 2>/dev/null; do sleep 1; done
        echo "Creating topics (if missing)..."
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic orders.created --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic orders.updated --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1
        echo "Topics ready. Done."

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Jenkins is opt-in so that `docker compose up` does not start the CI server.
  jenkins:
    profiles: ["ci"]
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: on-failure

volumes:
  jenkins_home:
  mongo_data:
